<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#1769D2" name="theme-color"/>
  <meta content="Traditional favourites from Princess Food Products, Namakkal, Tamil Nadu." name="description"/>
  <title>
   Product Details | Princess Food Products
  </title>
  <link href="../css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <!-- Shared header is rendered by js/app.js -->
  <div id="site-header">
  </div>
  <main>
   <!-- Page content starts here -->
   <section class="page-banner">
    <div class="container">
     <span class="eyebrow">
      Product details
     </span>
     <h1 class="page-title">
      A closer look at your favourite
     </h1>
     <p>
      Choose a pack size, check product information and add it to your basket. Verified ingredients and label details should be supplied by the business.
     </p>
    </div>
   </section>
   <section id="productDetail">
   </section>
   <section class="section section-soft">
    <div class="container">
     <div class="section-head">
      <div>
       <span class="eyebrow">
        You may also like
       </span>
       <h2>
        Related pantry favourites
       </h2>
      </div>
     </div>
     <div class="product-grid" id="relatedProducts">
     </div>
    </div>
   </section>
  </main>
  <!-- Shared footer is rendered by js/app.js -->
  <div id="site-footer">
  </div>
  <script src="../js/products.js">
  </script>
  <script src="../js/app.js">
  </script>
 </body>
</html>
